name: Build Cloudy GUI APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Unzip project
        run: |
          if [ -f CloudyGUI-termux.zip ]; then
            unzip -q CloudyGUI-termux.zip
            echo "DIR=CloudyGUI-termux" >> "$GITHUB_ENV"
          else
            unzip -q CloudyGUI-project.zip
            echo "DIR=CloudyGUI" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK
        working-directory: ${{ env.DIR }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: CloudyGUI-debug-apk
          path: ${{ env.DIR }}/app/build/outputs/apk/debug/*.apk
